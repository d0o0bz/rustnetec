[target.aarch64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-gnu:edge"
pre-build = [
    "dpkg --add-architecture $CROSS_DEB_ARCH",
    "apt-get update -y",
    "apt-get install -y --no-install-recommends libelf-dev:arm64 zlib1g-dev:arm64 libpcap-dev:arm64 gcc-aarch64-linux-gnu protobuf-compiler:amd64 python3:amd64 libseccomp-dev:arm64 libbpf-dev clang llvm libgtk-3-dev:arm64 libxdo-dev:arm64"
]

[target.armv7-unknown-linux-gnueabihf]
image = "ghcr.io/cross-rs/armv7-unknown-linux-gnueabihf:edge"
pre-build = [
    "dpkg --add-architecture $CROSS_DEB_ARCH",
    "apt-get update -y",
    "apt-get install -y --no-install-recommends libelf-dev:armhf zlib1g-dev:armhf libpcap-dev:armhf gcc-arm-linux-gnueabihf protobuf-compiler:amd64 python3:amd64 libseccomp-dev:armhf libbpf-dev clang llvm libgtk-3-dev:armhf libxdo-dev:armhf"
]

[target.x86_64-unknown-freebsd]
# FreeBSD cross-compilation uses a Linux container with FreeBSD sysroot
# The sysroot should already contain libpcap
# No pre-build steps needed as we can't run FreeBSD package manager in Linux container

